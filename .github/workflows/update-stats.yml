name: Update README cards
# name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          USERNAME: parhamkebria
          THEME: dark
          CARD_PATH: profile/stats.svg

      - name: Generate Streak Stats Card
        uses: DenverCoder1/github-readme-streak-stats@v1
        env:
          TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          options: user=parhamkebria&theme=dark&hide_border=false
          path: profile/streak.svg

      - name: Commit and Push SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update profile stats" && git push)
